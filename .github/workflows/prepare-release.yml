name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare, X.Y.Z
        required: true
      dry-run:
        description: Print the plan without pushing or opening a PR
        type: boolean
        default: true

jobs:
  prepare:
    permissions:
      contents: write
      pull-requests: write
    uses: plaxieappier/mobile-release-workflows/.github/workflows/prepare-release.yml@v1
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
